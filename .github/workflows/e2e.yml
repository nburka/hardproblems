name: E2E

# Runs the Playwright critical-path suite on every PR and on every
# push to main. Failing tests mark the commit red on GitHub and (with
# branch protection turned on) block the PR from merging until fixed.
# On failure the HTML report + traces + screenshots are uploaded as an
# artifact so you can download and open the report to see what broke.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# When a new commit lands on a branch, cancel any in-progress run for
# the same branch — no point testing a stale commit.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Cache the Playwright browser download between runs. The cache
      # key is the resolved Playwright version so any bump triggers a
      # re-download automatically.
      - name: Resolve Playwright version
        id: pw-version
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Chromium (if not cached)
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        run: yarn test:e2e
        env:
          # Force CI mode so the config picks up retries + the GitHub
          # reporter that annotates PRs with failing test summaries.
          CI: true

      # Only uploaded on failure; report is ~1-2 MB per failing run.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
